<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyXP Admin</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#0b1d3a;color:#eaf1ff}
    .wrap{max-width:820px;margin:0 auto;padding:16px}
    .card{background:#122a52;border:1px solid #2d4d85;border-radius:12px;padding:12px;margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .metric{background:#0f2345;border:1px solid #2d4d85;border-radius:10px;padding:10px}
    .small{color:#aac0e8;font-size:12px}
    .list-item{border:1px solid #2d4d85;border-radius:10px;padding:8px;margin-top:8px}
    button{background:#63a4ff;color:#06224e;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700}
  </style>
</head>
<body>
<div class="wrap">
  <h2>BodyXP Admin Panel</h2>
  <div class="small">Simple usage + testimonials view</div>
  <div class="card">
    <h3>Usage Overview</h3>
    <div class="grid">
      <div class="metric"><div class="small">Saved Workouts</div><div id="mWorkouts">0</div></div>
      <div class="metric"><div class="small">Saved Reminders</div><div id="mReminders">0</div></div>
      <div class="metric"><div class="small">Testimonials</div><div id="mTestimonials">0</div></div>
    </div>
    <button onclick="refreshAdmin()">Refresh</button>
  </div>
  <div class="card">
    <h3>Testimonials List</h3>
    <div id="testimonialList"></div>
  </div>
</div>
<script>
const K = { workouts: 'bodyxp_workouts', reminders: 'bodyxp_reminders', testimonials: 'bodyxp_testimonials' };
function read(key){ try { return JSON.parse(localStorage.getItem(key)||'[]'); } catch { return []; } }
function refreshAdmin(){
  const workouts = read(K.workouts);
  const reminders = read(K.reminders);
  const testimonials = read(K.testimonials);
  mWorkouts.textContent = workouts.length;
  mReminders.textContent = reminders.length;
  mTestimonials.textContent = testimonials.length;
  testimonialList.innerHTML = testimonials.length
    ? testimonials.map(t => `<div class='list-item'><b>${t.name}</b> ${t.rating}<div>${t.msg}</div></div>`).join('')
    : '<div class="small">No testimonials yet.</div>';
}
refreshAdmin();
</script>
</body>
</html>
