// BMI
function bmi(w,h){
return (w/((h/100)**2)).toFixed(2);
}

// TIPS
function tips(extra){
let list=["Stay hydrated","Exercise","Eat healthy","Sleep well"];
if(extra) list.push(extra);

let i=0;
setInterval(()=>{
tip.classList.remove("show");
setTimeout(()=>{
tip.innerText=list[i];
tip.classList.add("show");
i=(i+1)%list.length;
},500);
},3000);
}

// MAIN
function generate(){
let a=Number(age.value);
let h=Number(height.value);
let w=Number(weight.value);
let t=Number(target.value);
let diet=document.getElementById("diet").value;

// AGE GROUP
let group="adult";
if(a<13) group="child";
else if(a<18) group="teen";
else if(a<80) group="adult";
else group="senior";

// GOAL
let goal="maintain";
if(t<w) goal="lose";
else if(t>w) goal="gain";

// GET WEEK
let week=meals[diet][group][goal];

// OUTPUT
let out="<h3>Meal Plan</h3>";

["Monday","Tuesday","Wednesday","Thursday","Friday"].forEach(day=>{
let m=week[day];

out+=`<p><b>${day}</b><br>
🍳 ${m[0]}<br>
🍛 ${m[1]}<br>
🌙 ${m[2]}</p>`;
});

output.innerHTML=out;

// RULE
let extra=null;
if(diet==="non-veg") extra="Avoid milk with fish";

tips(extra);
}
