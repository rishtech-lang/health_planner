<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodyXP</title>
<style>
:root {
  --bg: #021024;
  --card: #0b2a4a;
  --muted: #9ec5dd;
  --primary: #4cc9f0;
  --text: #e8f6ff;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #fb7185;
  --outline: rgba(105, 216, 255, 0.3);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(33, 131, 220, 0.28), transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(76, 201, 240, 0.22), transparent 40%),
    radial-gradient(circle at 50% 80%, rgba(4, 86, 153, 0.26), transparent 45%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(135deg, rgba(76, 201, 240, 0.05), rgba(13, 71, 161, 0.05));
  z-index: -2;
}

.header {
  text-align: center;
  padding: 28px 20px 16px;
}

.logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #6ee7ff, #4cc9f0, #67e8f9, #6ee7ff);
  background-size: 220% 220%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: logoFlow 6s ease infinite;
}

.logo .pulse {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: auto;
  height: auto;
  padding: 2px 4px;
  box-shadow: none;
  animation: pulseRing 2s infinite;
  position: relative;
  font-size: 30px;
  filter: drop-shadow(0 0 8px rgba(76, 201, 240, 0.95));
  text-shadow:
    0 0 6px rgba(125, 211, 252, 0.95),
    0 0 14px rgba(56, 189, 248, 0.8),
    0 0 22px rgba(6, 182, 212, 0.5);
}

.logo .brand-main {
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
}

@keyframes logoFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes pulseRing {
  0% {
    transform: scale(1);
    filter: drop-shadow(0 0 6px rgba(76, 201, 240, 0.8));
  }
  70% {
    transform: scale(1.13);
    filter: drop-shadow(0 0 14px rgba(76, 201, 240, 1));
  }
  100% {
    transform: scale(1);
    filter: drop-shadow(0 0 6px rgba(76, 201, 240, 0.8));
  }
}

.subtext {
  color: var(--muted);
  margin-top: 4px;
}

.app {
  max-width: 520px;
  margin: auto;
  padding: 8px 10px 22px;
}

.card {
  background: var(--card);
  border: 1px solid var(--outline);
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 12px 30px rgba(2, 16, 36, 0.35);
}

h3 {
  margin: 8px 0 10px;
}

label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}

input,
select,
button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 12px;
  border: none;
  font-size: 15px;
}

input,
select {
  background: #061b36;
  color: var(--text);
  border: 1px solid rgba(158, 197, 221, 0.38);
}

button {
  background: var(--primary);
  color: #003049;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.07);
}

.inline {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

#output {
  line-height: 1.45;
}

.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.metric {
  background: #07223f;
  border-radius: 12px;
  padding: 10px;
}

.metric .label {
  color: var(--muted);
  font-size: 12px;
}

.metric .value {
  font-size: 19px;
  font-weight: 800;
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 5px;
}

.badge.ok {
  background: rgba(34, 197, 94, 0.2);
  color: #86efac;
}

.badge.warn {
  background: rgba(245, 158, 11, 0.2);
  color: #fde68a;
}

.badge.bad {
  background: rgba(239, 68, 68, 0.2);
  color: #fecaca;
}

.plan-day {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  background: #07223f;
}

.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #07223f;
  border-radius: 10px;
  padding: 10px;
  margin-top: 8px;
}

.list-item small {
  color: var(--muted);
}

.workout-done {
  text-decoration: line-through;
  color: var(--muted);
}

.list-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: auto;
  margin: 0;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 8px;
}

.icon-btn.remove {
  background: #f43f5e;
  color: white;
}

.ocean-decor {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

.bubble {
  position: absolute;
  bottom: -40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(216, 241, 255, 0.5), rgba(124, 210, 255, 0.08));
  animation: rise linear infinite;
}

.bubble.b1 { left: 8%; width: 20px; height: 20px; animation-duration: 16s; }
.bubble.b2 { left: 24%; width: 12px; height: 12px; animation-duration: 11s; }
.bubble.b3 { left: 42%; width: 28px; height: 28px; animation-duration: 18s; }
.bubble.b4 { left: 61%; width: 16px; height: 16px; animation-duration: 13s; }
.bubble.b5 { left: 78%; width: 24px; height: 24px; animation-duration: 20s; }
.bubble.b6 { left: 91%; width: 10px; height: 10px; animation-duration: 10s; }

@keyframes rise {
  from {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  20% { opacity: 0.7; }
  to {
    transform: translateY(-115vh) translateX(18px);
    opacity: 0;
  }
}

#tip {
  text-align: center;
  opacity: 0;
  transition: 1s;
  color: var(--muted);
  margin-bottom: 15px;
}

.show {
  opacity: 1;
}
</style>
</head>
<body>
  <div class="ocean-decor" aria-hidden="true">
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
    <span class="bubble b5"></span>
    <span class="bubble b6"></span>
  </div>
  <div class="header">
    <div class="logo">
      <span class="pulse" aria-hidden="true">💪</span>
      <span class="brand-main">BODYXP</span>
    </div>
    <div class="subtext">🥣 Meal Planner + 🏋🏻‍♀️Workout Tracker + 📊BMI + ⏰Reminders</div>
  </div>

  <div class="app">
    <div class="card">
      <h3>Generate Your Plan</h3>

      <div class="inline">
        <div>
          <label for="age">Age</label>
          <input id="age" type="number" min="1" max="120" placeholder="Enter age" />
        </div>

          <label for="height">Height (cm)</label>
          <input id="height" type="number" min="40" max="260" placeholder="e.g. 170" />
        </div>
        <div>
          <label for="weight">Weight (kg)</label>
          <input id="weight" type="number" min="15" max="350" placeholder="e.g. 72" />
        </div>
      </div>

      <div class="inline">
        <div>
          <label for="target">Target Weight (kg)</label>
          <input id="target" type="number" min="15" max="350" placeholder="e.g. 68" />
        </div>
        <div>
          <label for="water">Water Intake Goal (L/day)</label>
          <input id="water" type="number" min="0" max="10" step="0.1" placeholder="e.g. 2.5" />
        </div>
      </div>

      <button type="button" onclick="generate()">Generate Plan</button>
      <div id="formError" class="subtext"></div>
    </div>

    <div id="output" class="card">Fill your details and click <b>Generate Plan</b>.</div>

    <div class="card">
      <h3>Workout Tracker</h3>
      <input id="workoutInput" type="text" placeholder="Add workout (e.g. 30 min walk)" />
      <button type="button" onclick="addWorkout()">Add Workout</button>
      <div id="workoutList"></div>
    </div>

    <div class="card">
      <h3>Reminders</h3>
      <input id="reminderText" type="text" placeholder="Reminder text" />
      <div class="inline">
        <input id="reminderTime" type="datetime-local" />
        <button type="button" onclick="addReminder()">Add Reminder</button>
      </div>
      <div id="reminderList"></div>
    </div>

    <div id="tip"></div>
  </div>

};

const workoutStorageKey = 'bodyxp_workouts';
const reminderStorageKey = 'bodyxp_reminders';
let tipsIntervalId = null;
const weekdays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const mealAlternatives = {
  Fruit: ['Fruit Bowl', 'Papaya + Apple'],
  Dal: ['Moong Dal', 'Mixed Lentil Dal'],
  Soup: ['Vegetable Soup', 'Tomato Soup'],
  Milk: ['Warm Milk', 'Almond Milk'],
  Roti: ['Multi-grain Roti', 'Phulka'],
  Khichdi: ['Moong Khichdi', 'Vegetable Khichdi'],
  Oats: ['Oats Porridge', 'Overnight Oats'],
  Apple: ['Apple Slices', 'Apple + Nuts'],
  Paneer: ['Grilled Paneer', 'Paneer Bhurji'],
  Veg: ['Sauteed Veggies', 'Mixed Veg Curry'],
  Poha: ['Veg Poha', 'Peanut Poha'],
  Rice: ['Brown Rice', 'Jeera Rice'],
  Curd: ['Plain Curd', 'Greek Yogurt'],
  Upma: ['Vegetable Upma', 'Rava Upma'],
  Idli: ['Idli + Sambar', 'Ragi Idli'],
  Sabzi: ['Seasonal Sabzi', 'Dry Veg Sabzi'],
  Eggs: ['Boiled Eggs', 'Scrambled Eggs'],
  Egg: ['Boiled Egg', 'Masala Egg'],
  Chicken: ['Grilled Chicken', 'Chicken Stew'],
  Fish: ['Grilled Fish', 'Steamed Fish'],
  Omelette: ['Veg Omelette', 'Cheese Omelette'],
  'Protein shake': ['Protein Smoothie', 'Milk + Whey Shake'],
  Smoothie: ['Banana Smoothie', 'Berry Smoothie']
};

function bmi(weightKg, heightCm) {
  return weightKg / ((heightCm / 100) ** 2);
}

function getBmiStatus(value) {
  if (value < 18.5) return { label: 'Underweight', cls: 'warn' };
  if (value < 25) return { label: 'Healthy', cls: 'ok' };
  if (value < 30) return { label: 'Overweight', cls: 'warn' };
  return { label: 'Obese', cls: 'bad' };
}

function getHeightStatus(heightCm) {
  if (heightCm < 150) return { label: 'Short Height Range', cls: 'warn' };
  if (heightCm <= 185) return { label: 'Average Height Range', cls: 'ok' };
  return { label: 'Tall Height Range', cls: 'ok' };
}

function validateInputs(age, height, weight, target) {
  if (!Number.isFinite(age) || age < 1 || age > 120) return 'Please enter a valid age (1-120).';
  if (!Number.isFinite(height) || height < 40 || height > 260) return 'Please enter a valid height in cm (40-260).';
  if (!Number.isFinite(weight) || weight < 15 || weight > 350) return 'Please enter a valid weight in kg (15-350).';
  if (!Number.isFinite(target) || target < 15 || target > 350) return 'Please enter a valid target weight in kg (15-350).';
  return '';
}

function pickMealVariant(mealName) {
  const options = [mealName, ...(mealAlternatives[mealName] || [])];
  const randomIndex = Math.floor(Math.random() * options.length);
  return options[randomIndex];
}

function buildDynamicWeek(week) {
  const dynamicWeek = {};
  weekdays.forEach(day => {
    const dayMeals = week[day] || [];
    dynamicWeek[day] = dayMeals.map(meal => pickMealVariant(meal));
  });
  return dynamicWeek;
}

function renderHealthSummary(height, weight) {
  const bmiValue = bmi(weight, height);
  const bmiInfo = getBmiStatus(bmiValue);
  const heightInfo = getHeightStatus(height);

  return `
    <h3>Health Summary</h3>
    <div class="metric-grid">
      <div class="metric">
        <div class="label">BMI</div>
        <div class="value">${bmiValue.toFixed(2)}</div>
        <span class="badge ${bmiInfo.cls}">${bmiInfo.label}</span>
      </div>
      <div class="metric">
        <div class="label">Height Status</div>
        <div class="value">${height} cm</div>
        <span class="badge ${heightInfo.cls}">${heightInfo.label}</span>
      </div>
    </div>
  `;
}

function tips(extra) {
  const tipEl = document.getElementById('tip');
  const list = ['Stay hydrated', 'Exercise daily', 'Eat balanced meals', 'Sleep 7-8 hours'];
  if (extra) list.push(extra);

  let i = 0;
  tipEl.textContent = list[0];
  tipEl.classList.add('show');

  if (tipsIntervalId) {
    clearInterval(tipsIntervalId);
  }

  tipsIntervalId = setInterval(() => {
    tipEl.classList.remove('show');
    setTimeout(() => {
      i = (i + 1) % list.length;
      tipEl.textContent = list[i];
      tipEl.classList.add('show');
    }, 300);
  }, 3000);
}

function generate() {
  const age = Number(document.getElementById('age').value);
  const height = Number(document.getElementById('height').value);
  const weight = Number(document.getElementById('weight').value);
  const target = Number(document.getElementById('target').value);
  const water = Number(document.getElementById('water').value || 0);
  const diet = document.getElementById('diet').value;
  const formError = document.getElementById('formError');
  const output = document.getElementById('output');

  const errorMsg = validateInputs(age, height, weight, target);
  if (errorMsg) {
    formError.textContent = errorMsg;
    return;
  }
  formError.textContent = '';

  let group = 'adult';
  if (age < 13) group = 'child';
  else if (age < 18) group = 'teen';
  else if (age >= 80) group = 'senior';

  let goal = 'maintain';
  if (target < weight) goal = 'lose';
  else if (target > weight) goal = 'gain';

  const week = meals[diet][group][goal];
  const dynamicWeek = buildDynamicWeek(week);
  const groupLabel = group.charAt(0).toUpperCase() + group.slice(1);

  let out = renderHealthSummary(height, weight);
  out += `<h3>Meal Plan for - ${groupLabel}</h3>`;
  out += `<p><b>Goal:</b> ${goal.toUpperCase()}</p>`;

  weekdays.forEach(day => {
    const m = dynamicWeek[day];
    out += `
      <div class="plan-day">
        <b>${day}</b><br>
        🍳 ${m[0]}<br>
        🍛 ${m[1]}<br>
        🌙 ${m[2]}
      </div>
    `;
  });

  if (water > 0) {
    out += `<p><b>Daily Water Goal:</b> ${water.toFixed(1)} L/day</p>`;
  }

  output.innerHTML = out;

  let extra = null;
  if (diet === 'non-veg') extra = 'Tip: Avoid milk with fish in the same meal.';
  tips(extra);
}

function getStoredArray(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return [];
  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function setStoredArray(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function renderWorkouts() {
  const workouts = getStoredArray(workoutStorageKey);
  const listEl = document.getElementById('workoutList');

  if (!workouts.length) {
    listEl.innerHTML = '<small class="subtext">No workouts yet.</small>';
    return;
  }

  listEl.innerHTML = workouts.map((item, i) => `
    <div class="list-item">
      <div class="${item.done ? 'workout-done' : ''}">${item.text}</div>
      <div class="list-actions">
        <button class="icon-btn" type="button" onclick="toggleWorkout(${i})">${item.done ? 'Undo' : 'Done'}</button>
        <button class="icon-btn remove" type="button" onclick="removeWorkout(${i})">Delete</button>
      </div>
    </div>
  `).join('');
}

function addWorkout() {
  const input = document.getElementById('workoutInput');
  const text = input.value.trim();
  if (!text) return;

  const workouts = getStoredArray(workoutStorageKey);
  workouts.push({ text, done: false, createdAt: new Date().toISOString() });
  setStoredArray(workoutStorageKey, workouts);
  input.value = '';
  renderWorkouts();
}

function toggleWorkout(index) {
  const workouts = getStoredArray(workoutStorageKey);
  if (!workouts[index]) return;
  workouts[index].done = !workouts[index].done;
  setStoredArray(workoutStorageKey, workouts);
  renderWorkouts();
}

function removeWorkout(index) {
  const workouts = getStoredArray(workoutStorageKey);
  workouts.splice(index, 1);
  setStoredArray(workoutStorageKey, workouts);
  renderWorkouts();
}

function renderReminders() {
  const reminders = getStoredArray(reminderStorageKey)
    .sort((a, b) => new Date(a.time) - new Date(b.time));

  const listEl = document.getElementById('reminderList');
  if (!reminders.length) {
    listEl.innerHTML = '<small class="subtext">No reminders yet.</small>';
    return;
  }

  listEl.innerHTML = reminders.map((r, i) => {
    const dateText = new Date(r.time).toLocaleString();
    return `
      <div class="list-item">
        <div>
          <div>${r.text}</div>
          <small>${dateText}</small>
        </div>
        <button class="icon-btn remove" type="button" onclick="removeReminder(${i})">Delete</button>
      </div>
    `;
  }).join('');
}

function addReminder() {
  const textEl = document.getElementById('reminderText');
  const timeEl = document.getElementById('reminderTime');
  const text = textEl.value.trim();
  const time = timeEl.value;

  if (!text || !time) return;

  const reminders = getStoredArray(reminderStorageKey);
  reminders.push({ text, time, createdAt: new Date().toISOString() });
  setStoredArray(reminderStorageKey, reminders);

  textEl.value = '';
  timeEl.value = '';
  renderReminders();
}

function removeReminder(index) {
  const reminders = getStoredArray(reminderStorageKey)
    .sort((a, b) => new Date(a.time) - new Date(b.time));
  reminders.splice(index, 1);
  setStoredArray(reminderStorageKey, reminders);
  renderReminders();
}

renderWorkouts();
renderReminders();
tips();
</script>
</body>
</html>
