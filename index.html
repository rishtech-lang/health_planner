<!DOCTYPE html>
<html>
<head>
    <title>Ultra Health Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 10px;
        }

        h1 {
            font-size: 28px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            margin: 15px auto;
            max-width: 400px;
        }

        input, select, button {
            width: 90%;
            margin: 8px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        button {
            background: #22c55e;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #16a34a;
        }

        p {
            text-align: left;
        }
    </style>
</head>

<body>

<h1>🚀 Ultra Health Planner</h1>

<div class="card">
    <input id="age" placeholder="Age">
    <input id="height" placeholder="Height (cm)">
    <input id="weight" placeholder="Current Weight (kg)">
    <input id="target" placeholder="Target Weight (kg)">
    <input id="water" placeholder="Water Intake (liters)">

    <select id="diet">
        <option value="veg">Veg</option>
        <option value="non-veg">Non-Veg</option>
    </select>

    <button onclick="generatePlan()">Generate Plan</button>
</div>

<div id="output" class="card"></div>

<script>
function bmi(weight, height) {
    let h = height / 100;
    return (weight / (h*h)).toFixed(2);
}

function bmiCategory(bmi) {
    if (bmi < 18.5) return "Underweight";
    if (bmi < 25) return "Normal";
    if (bmi < 30) return "Overweight";
    return "Obese";
}

function generatePlan() {
    let age = Number(document.getElementById("age").value);
    let height = Number(document.getElementById("height").value);
    let weight = Number(document.getElementById("weight").value);
    let target = Number(document.getElementById("target").value);
    let water = Number(document.getElementById("water").value);
    let diet = document.getElementById("diet").value;

    // Goal detection
    let goal = "maintain";
    if (target < weight) goal = "lose";
    else if (target > weight) goal = "gain";

    let bmiVal = bmi(weight, height);
    let category = bmiCategory(bmiVal);

    let ageGroup = age < 13 ? "child" : "teen";

    // SIMPLE MEAL DATABASE (WORKING)
   let meals = {
    "veg": {
        "child": {
            "lose": {
                "Monday": ["Fruit bowl", "Dal rice", "Veg soup"],
                "Tuesday": ["Milk + banana", "Soft roti + sabzi", "Khichdi"],
                "Wednesday": ["Oats", "Dal + rice", "Soup"],
                "Thursday": ["Apple", "Paneer (small)", "Light meal"],
                "Friday": ["Poha", "Rice + dal", "Soup"]
            },
            "gain": {
                "Monday": ["Milkshake", "Rice + paneer", "Soft roti"],
                "Tuesday": ["Banana milk", "Dal rice", "Paneer"],
                "Wednesday": ["Oats + nuts", "Rice", "Curd"],
                "Thursday": ["Smoothie", "Paneer", "Veg"],
                "Friday": ["Upma", "Dal rice", "Curd"]
            },
            "maintain": {
                "Monday": ["Poha", "Dal rice", "Veg"],
                "Tuesday": ["Milk + fruit", "Rice", "Light"],
                "Wednesday": ["Upma", "Soft roti", "Soup"],
                "Thursday": ["Oats", "Paneer", "Veg"],
                "Friday": ["Idli", "Dal rice", "Light"]
            }
        },

        "teen": {
            "lose": {
                "Monday": ["Oats + nuts", "Salad + dal", "Soup"],
                "Tuesday": ["Fruit bowl + seeds", "Roti + sabzi", "Light dinner"],
                "Wednesday": ["Protein smoothie", "Dal + rice", "Soup"],
                "Thursday": ["Apple + peanut butter", "Paneer salad", "Light"],
                "Friday": ["Poha + peanuts", "Dal + roti", "Soup"]
            },
            "gain": {
                "Monday": ["Shake + nuts", "Rice + paneer", "Full meal"],
                "Tuesday": ["Banana shake", "Dal + rice", "Paneer + roti"],
                "Wednesday": ["Oats + nuts", "Rice + dal", "Curd + roti"],
                "Thursday": ["Smoothie", "Paneer + roti", "Veg + curd"],
                "Friday": ["Upma", "Dal + rice", "Curd + salad"]
            },
            "maintain": {
                "Monday": ["Poha + nuts", "Dal + roti", "Veg"],
                "Tuesday": ["Milk + fruit", "Rice + dal", "Balanced meal"],
                "Wednesday": ["Upma", "Roti + veg", "Soup"],
                "Thursday": ["Oats", "Paneer + roti", "Veg"],
                "Friday": ["Idli", "Dal + rice", "Light sabzi"]
            }
        }
    },
        "non-veg": {
            "child": {
                "lose": {
                    "Monday": ["Eggs", "Chicken salad", "Soup"],
                    "Tuesday": ["Egg + milk", "Chicken", "Light"],
                    "Wednesday": ["Eggs", "Chicken + rice", "Soup"],
                    "Thursday": ["Milk", "Fish", "Light"],
                    "Friday": ["Eggs", "Chicken", "Soup"]
                },
                "gain": {
                    "Monday": ["Egg + milk", "Chicken + rice", "Fish"],
                    "Tuesday": ["Omelette", "Chicken", "Egg meal"],
                    "Wednesday": ["Eggs", "Chicken + rice", "Fish"],
                    "Thursday": ["Milk", "Chicken", "Egg"],
                    "Friday": ["Omelette", "Chicken + rice", "Fish"]
                },
                "maintain": {
                    "Monday": ["Eggs", "Chicken", "Light"],
                    "Tuesday": ["Omelette", "Chicken + rice", "Soup"],
                    "Wednesday": ["Eggs", "Fish", "Light"],
                    "Thursday": ["Milk", "Chicken", "Soup"],
                    "Friday": ["Eggs", "Chicken + rice", "Light"]
                }
            },
            "teen": {
                "lose": {
                    "Monday": ["Eggs", "Chicken", "Soup"],
                    "Tuesday": ["Egg whites", "Chicken salad", "Light"],
                    "Wednesday": ["Eggs", "Chicken + rice", "Soup"],
                    "Thursday": ["Milk", "Fish", "Light"],
                    "Friday": ["Eggs", "Chicken", "Soup"]
                },
                "gain": {
                    "Monday": ["Eggs + milk", "Chicken + rice", "Fish"],
                    "Tuesday": ["Omelette", "Chicken", "Eggs"],
                    "Wednesday": ["Eggs", "Chicken + rice", "Fish"],
                    "Thursday": ["Milk", "Chicken", "Egg"],
                    "Friday": ["Omelette", "Chicken + rice", "Fish"]
                },
                "maintain": {
                    "Monday": ["Eggs", "Chicken", "Light"],
                    "Tuesday": ["Omelette", "Chicken + rice", "Soup"],
                    "Wednesday": ["Eggs", "Fish", "Light"],
                    "Thursday": ["Milk", "Chicken", "Soup"],
                    "Friday": ["Eggs", "Chicken + rice", "Light"]
                }
            }
        }
    };

    let week = meals[diet][ageGroup][goal];
    let weekDays = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

    let output = `
        <h2>📊 Health Report</h2>
        BMI: ${bmiVal} (${category})<br>
        Goal: ${goal}<br>
        Hydration: ${water >= 0.5 ? "Good 💧" : "Drink more!"}<br><br>
        <h2>🍽 Weekly Meal Plan</h2>
    `;

    weekDays.forEach(day => {
        let dayMeals = week[day];
        output += `
            <p><b>${day}</b><br>
            Breakfast: ${dayMeals[0]}<br>
            Lunch: ${dayMeals[1]}<br>
            Dinner: ${dayMeals[2]}</p>
        `;
    });

    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
