<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0ea5e9,#1e3a8a);
    color:white;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin:15px;
    color:#38bdf8;
}

.card{
    background:rgba(255,255,255,0.1);
    margin:10px auto;
    padding:15px;
    border-radius:20px;
    max-width:350px;
    backdrop-filter:blur(10px);
}

input,select,button{
    width:90%;
    padding:10px;
    margin:6px;
    border-radius:10px;
    border:none;
}

button{
    background:#38bdf8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#tip{
    margin-top:10px;
    opacity:0;
    transition:opacity 1s;
}
.show{
    opacity:1;
}
</style>
</head>

<body>

<div class="logo">⚡ BodyXP</div>

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target Weight">
<input id="water" placeholder="Water Intake">

<select id="diet">
<option value="veg">Veg</option>
<option value="non-veg">Non-Veg</option>
</select>

<button onclick="generate()">🚀 Generate</button>
<button onclick="startVoice()">🎤 Voice</button>
</div>

<div id="output" class="card"></div>
<div id="tip"></div>

<script>

// BMI
function bmi(w,h){
    return (w/((h/100)**2)).toFixed(2);
}

// VOICE 🎤
function startVoice(){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SR){
        alert("Voice not supported");
        return;
    }

    let rec = new SR();
    rec.start();

    rec.onresult = e=>{
        let text = e.results[0][0].transcript.toLowerCase();
        let num = text.match(/\d+/);
        num = num ? num[0] : "";

        if(text.includes("age")) age.value = num;
        if(text.includes("weight")) weight.value = num;
        if(text.includes("height")) height.value = num;

        alert("Heard: " + text);
    };
}

// MEALS 📅 (MON-FRI DIFFERENT)
let meals = {
    veg:{
        Monday:["Oats","Dal + Rice","Soup"],
        Tuesday:["Poha","Roti + Sabzi","Salad"],
        Wednesday:["Upma","Paneer","Soup"],
        Thursday:["Idli","Dal","Veg meal"],
        Friday:["Paratha","Rice","Light meal"]
    },
    "non-veg":{
        Monday:["Eggs","Chicken + Rice","Soup"],
        Tuesday:["Omelette","Fish","Light meal"],
        Wednesday:["Eggs","Chicken","Soup"],
        Thursday:["Toast + Eggs","Fish","Meal"],
        Friday:["Eggs","Chicken","Soup"]
    }
};

// TIPS 💡
let tipInterval;

function startTips(extra){
    clearInterval(tipInterval);

    let tips=[
        "💧 Drink enough water",
        "🏃 Stay active",
        "🥦 Eat healthy",
        "😴 Sleep well",
        "🔥 Stay consistent"
    ];

    if(extra) tips.push(extra);

    let i=0;
    let box=document.getElementById("tip");

    tipInterval = setInterval(()=>{
        box.classList.remove("show");

        setTimeout(()=>{
            box.innerText=tips[i];
            box.classList.add("show");
            i=(i+1)%tips.length;
        },500);

    },3000);
}

// MAIN 🚀
function generate(){
    let ageVal=Number(age.value);
    let h=Number(height.value);
    let w=Number(weight.value);
    let t=Number(target.value);
    let waterVal=Number(water.value);
    let diet=document.getElementById("diet").value;

    if(!ageVal||!h||!w){
        alert("Fill all fields!");
        return;
    }

    let goal="maintain";
    if(t<w) goal="lose";
    else if(t>w) goal="gain";

    let bmiVal=bmi(w,h);

    let week = meals[diet];

    let output=`
    <h3>📊 Health Report</h3>
    BMI: ${bmiVal}<br>
    Goal: ${goal}<br>
    Water: ${waterVal}<br><br>

    <h3>📅 Weekly Meal Plan</h3>
    `;

    for(let day in week){
        let m = week[day];

        output += `
        <p><b>${day}</b><br>
        🍳 ${m[0]}<br>
        🍛 ${m[1]}<br>
        🌙 ${m[2]}</p>`;
    }

    document.getElementById("output").innerHTML = output;

    let extra=null;
    if(diet==="non-veg"){
        extra="⚠️ Avoid milk with fish/chicken";
    }

    startTips(extra);
}

</script>

</body>
</html>
