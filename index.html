<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0ea5e9,#1e3a8a);
    color:white;
    text-align:center;
    overflow:hidden;
}

/* LOGO */
.logo{
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
    color:#38bdf8;
    text-shadow:0 0 10px #0ea5e9;
}

/* FLOATING ORGANS */
.organ{
    position:absolute;
    font-size:30px;
    animation:float 6s infinite ease-in-out;
    cursor:pointer;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0);}
}

/* UI */
.card{
    background:rgba(255,255,255,0.1);
    margin:10px auto;
    padding:15px;
    border-radius:20px;
    max-width:350px;
    backdrop-filter:blur(10px);
    position:relative;
    z-index:2;
}

input,select,button{
    width:90%;
    padding:10px;
    margin:5px;
    border-radius:10px;
    border:none;
}

button{
    background:#38bdf8;
    color:white;
}

/* popup */
#info{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:black;
    padding:10px;
    border-radius:10px;
    display:none;
}
</style>
</head>

<body>

<div class="logo">⚡ BodyXP</div>

<!-- ORGANS -->
<div class="organ" style="top:20%; left:10%" onclick="showInfo('❤️ Heart pumps blood')">❤️</div>
<div class="organ" style="top:40%; left:80%" onclick="showInfo('🧠 Brain controls body')">🧠</div>
<div class="organ" style="top:70%; left:20%" onclick="showInfo('🫁 Lungs help breathing')">🫁</div>

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target">
<input id="water" placeholder="Water">

<select id="diet">
<option value="veg">Veg</option>
<option value="non-veg">Non-Veg</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="voice()">🎤 Voice</button>
</div>

<div id="output" class="card"></div>
<div id="info"></div>

<script>
// VOICE FIX 🎤
function voice(){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SR){
        alert("Voice not supported");
        return;
    }

    let rec = new SR();
    rec.start();

    rec.onresult = e=>{
        let t = e.results[0][0].transcript.toLowerCase();

        if(t.includes("age")) age.value = t.match(/\d+/);
        if(t.includes("weight")) weight.value = t.match(/\d+/);
        if(t.includes("height")) height.value = t.match(/\d+/);

        alert("Heard: "+t);
    }
}

// MEAL PLAN 📅
let meals = {
veg:{
Monday:["Oats","Dal rice","Soup"],
Tuesday:["Poha","Roti sabzi","Salad"],
Wednesday:["Upma","Paneer","Soup"],
Thursday:["Idli","Dal","Veg meal"],
Friday:["Paratha","Rice","Light meal"]
},
"non-veg":{
Monday:["Eggs","Chicken rice","Soup"],
Tuesday:["Omelette","Fish","Light"],
Wednesday:["Eggs","Chicken","Soup"],
Thursday:["Toast eggs","Fish","Meal"],
Friday:["Eggs","Chicken","Soup"]
}
};

// MAIN
function generate(){
    let diet=document.getElementById("diet").value;

    let week=meals[diet];

    let out="<h3>📅 Weekly Plan</h3>";

    for(let day in week){
        let m=week[day];
        out+=`
        <p><b>${day}</b><br>
        Breakfast: ${m[0]}<br>
        Lunch: ${m[1]}<br>
        Dinner: ${m[2]}</p>`;
    }

    document.getElementById("output").innerHTML=out;
}

// ORGAN INFO
function showInfo(text){
    let box=document.getElementById("info");
    box.innerText=text;
    box.style.display="block";

    setTimeout(()=>box.style.display="none",2000);
}
</script>

</body>
</html>
