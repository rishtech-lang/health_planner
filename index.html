<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0ea5e9,#1e3a8a);
    color:white;
    text-align:center;
}

/* LOGO */
.logo{
    font-size:32px;
    margin:10px;
    color:#38bdf8;
}

/* ORGANS */
.organ{
    position:absolute;
    font-size:30px;
    animation:float 6s infinite ease-in-out;
    cursor:pointer;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0);}
}

/* CARD */
.card{
    background:rgba(255,255,255,0.1);
    margin:10px auto;
    padding:15px;
    border-radius:20px;
    max-width:350px;
    backdrop-filter:blur(10px);
    position:relative;
    z-index:2;
}

/* FULL SCREEN INFO PAGE */
#organPage{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0f172a;
    color:white;
    display:none;
    z-index:999;
    padding:20px;
    overflow:auto;
}

button{
    padding:10px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
}
</style>
</head>

<body>

<div class="logo">⚡ BodyXP</div>

<!-- MANY ORGANS -->
<div class="organ" style="top:10%; left:10%" onclick="openOrgan('heart')">❤️</div>
<div class="organ" style="top:20%; left:80%" onclick="openOrgan('brain')">🧠</div>
<div class="organ" style="top:70%; left:10%" onclick="openOrgan('lungs')">🫁</div>
<div class="organ" style="top:60%; left:80%" onclick="openOrgan('liver')">🧬</div>
<div class="organ" style="top:40%; left:50%" onclick="openOrgan('stomach')">🍽</div>
<div class="organ" style="top:80%; left:50%" onclick="openOrgan('kidney')">🫘</div>

<div class="card">
<h3>Click any organ 👆</h3>
</div>

<!-- FULL PAGE -->
<div id="organPage">
<h2 id="organTitle"></h2>
<p id="organText"></p>
<button onclick="closePage()">⬅ Back</button>
</div>

<script>

// ORGAN DATA 📖
let organData = {
heart:{
title:"❤️ Heart",
text:"The heart pumps blood throughout your body. It beats about 100,000 times a day and supplies oxygen."
},
brain:{
title:"🧠 Brain",
text:"The brain controls everything — thoughts, memory, movement, and emotions."
},
lungs:{
title:"🫁 Lungs",
text:"Lungs help you breathe. They take in oxygen and remove carbon dioxide."
},
liver:{
title:"🧬 Liver",
text:"The liver cleans your blood and helps digest food."
},
stomach:{
title:"🍽 Stomach",
text:"The stomach breaks down food using acids and enzymes."
},
kidney:{
title:"🫘 Kidneys",
text:"Kidneys filter waste from your blood and produce urine."
}
};

// OPEN FULL PAGE 🚀
function openOrgan(name){
    let data = organData[name];

    document.getElementById("organTitle").innerText = data.title;
    document.getElementById("organText").innerText = data.text;

    document.getElementById("organPage").style.display = "block";
}

// CLOSE PAGE
function closePage(){
    document.getElementById("organPage").style.display = "none";
}

</script>

</body>
</html>
