<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
}

/* 🔥 SVG LOGO CONTAINER */
.logo svg{
    width:120px;
}

/* APP */
.app{
    max-width:420px;
    margin:auto;
    padding:10px;
}

/* CARD */
.card{
    background:#1e293b;
    border-radius:20px;
    padding:15px;
    margin-bottom:12px;
    animation:fadeIn 0.5s;
}

/* INPUTS */
input,select,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:none;
}

/* BUTTON */
button{
    background:linear-gradient(90deg,#38bdf8,#0ea5e9);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:active{transform:scale(0.95);}

/* TIP */
#tip{text-align:center;opacity:0;transition:1s;}
.show{opacity:1;}

/* GRAPH */
canvas{
    background:white;
    border-radius:12px;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="header">

<!-- 🔥 REAL SVG LOGO -->
<div class="logo">
<svg viewBox="0 0 200 60">
<defs>
<linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#38bdf8"/>
<stop offset="100%" style="stop-color:#0ea5e9"/>
</linearGradient>
</defs>

<text x="10" y="40" font-size="32" font-weight="900" fill="url(#grad)">
BODYXP
</text>
</svg>
</div>

<div style="font-size:12px;opacity:0.7;">Level Up Your Body</div>

</div>

<div class="app">

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target Weight">
<input id="water" placeholder="Water Intake">

<select id="diet">
<option value="veg">Veg</option>
<option value="non-veg">Non-Veg</option>
</select>

<button onclick="generate()">Generate Plan</button>
</div>

<div id="output" class="card"></div>

<div class="card">
<h3>Progress</h3>
<canvas id="chart" width="350" height="200"></canvas>
</div>

<div id="tip"></div>

</div>

<script>

// MEALS (AGE + GOAL)
let meals={
veg:{
child:{
lose:["Fruit bowl","Dal + rice","Soup"],
gain:["Milkshake","Paneer + rice","Roti"],
maintain:["Poha","Dal + roti","Veg"]
},
teen:{
lose:["Oats","Salad + dal","Soup"],
gain:["Shake","Rice + paneer","Veg"],
maintain:["Upma","Dal","Veg"]
},
adult:{
lose:["Oats","Grilled veg","Soup"],
gain:["Protein shake","Paneer","Full meal"],
maintain:["Idli","Balanced meal","Light"]
}
},
"non-veg":{
child:{
lose:["Eggs","Chicken salad","Soup"],
gain:["Eggs","Chicken + rice","Fish"],
maintain:["Eggs","Chicken","Light"]
},
teen:{
lose:["Boiled eggs","Chicken","Soup"],
gain:["Eggs","Chicken + rice","Fish"],
maintain:["Eggs","Chicken","Light"]
},
adult:{
lose:["Egg whites","Chicken salad","Soup"],
gain:["Eggs","Chicken","Fish"],
maintain:["Eggs","Chicken","Balanced"]
}
}
};

// BMI
function bmi(w,h){
return (w/((h/100)**2)).toFixed(2);
}

// GRAPH
function drawChart(){
let ctx=chart.getContext("2d");
let data=JSON.parse(localStorage.getItem("weights"))||[];

ctx.clearRect(0,0,350,200);

ctx.beginPath();
data.forEach((w,i)=>{
let x=i*40;
let y=200-w;
if(i===0) ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});
ctx.stroke();
}

// TIPS
let tipInterval;
function tips(extra){
clearInterval(tipInterval);

let list=["Stay hydrated","Exercise","Eat healthy","Sleep well"];
if(extra) list.push(extra);

let i=0;
tipInterval=setInterval(()=>{
tip.classList.remove("show");
setTimeout(()=>{
tip.innerText=list[i];
tip.classList.add("show");
i=(i+1)%list.length;
},500);
},3000);
}

// MAIN
function generate(){
let a=Number(age.value);
let h=Number(height.value);
let w=Number(weight.value);
let t=Number(target.value);
let waterVal=Number(water.value);
let diet=dietSelect.value;

if(!a||!h||!w){alert("Fill all fields");return;}

// AGE GROUP
let group="adult";
if(a<13) group="child";
else if(a<18) group="teen";

// GOAL
let goal="maintain";
if(t<w) goal="lose";
else if(t>w) goal="gain";

// BMI
let b=bmi(w,h);

// SAVE
localStorage.setItem("age",a);
localStorage.setItem("height",h);
localStorage.setItem("weight",w);

// GRAPH
let arr=JSON.parse(localStorage.getItem("weights"))||[];
arr.push(w);
localStorage.setItem("weights",JSON.stringify(arr));
drawChart();

// MEAL
let meal=meals[diet][group][goal];

// OUTPUT
let out=`<h3>Health Report</h3>
BMI: ${b}<br>
Goal: ${goal}<br><br>

<h3>Meal Plan</h3>`;

["Mon","Tue","Wed","Thu","Fri"].forEach(d=>{
out+=`<p><b>${d}</b><br>
🍳 ${meal[0]}<br>
🍛 ${meal[1]}<br>
🌙 ${meal[2]}</p>`;
});

output.innerHTML=out;

// RULE
let extra=null;
if(diet==="non-veg") extra="Avoid milk with fish/chicken";

tips(extra);
}

// LOAD
window.onload=function(){
age.value=localStorage.getItem("age")||"";
height.value=localStorage.getItem("height")||"";
weight.value=localStorage.getItem("weight")||"";
drawChart();
};

</script>

</body>
</html>
