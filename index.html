<!DOCTYPE html>
<html>
<head>
    <title>Ultra Health AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
            animation: fadeIn 1s ease-in-out;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin: 15px auto;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.8s ease;
        }

        input, select, button {
            width: 90%;
            margin: 8px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
        }

        input, select {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        button {
            background: linear-gradient(45deg, #22c55e, #4ade80);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            text-align: left;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes slideUp {
            from {transform: translateY(40px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }
    </style>
</head>

<body>

<h1>🤖 Ultra Health AI</h1>

<div class="card">
    <input id="age" placeholder="Age">
    <input id="height" placeholder="Height (cm)">
    <input id="weight" placeholder="Current Weight (kg)">
    <input id="target" placeholder="Target Weight (kg)">
    <input id="water" placeholder="Water Intake (liters)">

    <select id="diet">
        <option value="veg">🥦 Veg</option>
        <option value="non-veg">🍗 Non-Veg</option>
    </select>

    <button onclick="generatePlan()">✨ Generate AI Plan</button>
</div>

<div id="output" class="card result"></div>

<script>
function bmi(weight, height) {
    let h = height / 100;
    return (weight / (h*h)).toFixed(2);
}

function bmiCategory(bmi) {
    if (bmi < 18.5) return "Underweight";
    if (bmi < 25) return "Normal";
    if (bmi < 30) return "Overweight";
    return "Obese";
}

function generatePlan() {
    let age = Number(document.getElementById("age").value);
    let height = Number(document.getElementById("height").value);
    let weight = Number(document.getElementById("weight").value);
    let target = Number(document.getElementById("target").value);
    let water = Number(document.getElementById("water").value);
    let diet = document.getElementById("diet").value;

    // Goal detection
    let goal = "maintain";
    if (target < weight) goal = "lose";
    else if (target > weight) goal = "gain";

    let bmiVal = bmi(weight, height);
    let category = bmiCategory(bmiVal);
    let ageGroup = age < 13 ? "child" : "teen";

    // FOOD DATABASE (NO MILK WITH NON-VEG)
    let foodDB = {
        veg: {
            breakfast: ["Oats", "Poha", "Upma", "Fruit bowl", "Smoothie", "Idli", "Paratha"],
            lunch: ["Dal + rice", "Roti + sabzi", "Paneer + roti", "Veg pulao", "Khichdi"],
            dinner: ["Soup", "Light sabzi", "Paneer", "Veg salad", "Roti + veg"]
        },
        nonveg: {
            breakfast: ["Eggs", "Omelette", "Boiled eggs", "Toast + eggs"],
            lunch: ["Chicken + rice", "Grilled chicken", "Fish + roti", "Chicken curry"],
            dinner: ["Soup", "Chicken salad", "Fish", "Light chicken meal"]
        }
    };

    function adjustMeal(mealList, goal) {
        if (goal === "gain") return mealList.concat(["Extra protein", "Nuts", "Shake"]);
        if (goal === "lose") return mealList.filter(m => !m.includes("Paratha"));
        return mealList;
    }

    let mealsDB = foodDB[diet];
    let weekDays = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

    let output = `
        <h2>📊 Health Report</h2>
        BMI: <b>${bmiVal}</b> (${category})<br>
        Age Group: <b>${ageGroup}</b><br>
        Goal: <b>${goal}</b><br>
        Hydration: <b>${water >= 0.5 ? "Good 💧" : "Drink more!"}</b><br><br>

        <h2>🍽 AI Weekly Plan</h2>
    `;

    // RANDOM AI MEALS 🔥
    weekDays.forEach(day => {
        let breakfastList = adjustMeal(mealsDB.breakfast, goal);
        let lunchList = adjustMeal(mealsDB.lunch, goal);
        let dinnerList = adjustMeal(mealsDB.dinner, goal);

        let breakfast = breakfastList[Math.floor(Math.random() * breakfastList.length)];
        let lunch = lunchList[Math.floor(Math.random() * lunchList.length)];
        let dinner = dinnerList[Math.floor(Math.random() * dinnerList.length)];

        output += `
            <p>
            <b>📅 ${day}</b><br>
            🍳 Breakfast: ${breakfast}<br>
            🍛 Lunch: ${lunch}<br>
            🌙 Dinner: ${dinner}
            </p>
        `;
    });

    output += `<br>🤖 AI Tip: Avoid milk with fish/chicken. Stay consistent and exercise!`;

    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
