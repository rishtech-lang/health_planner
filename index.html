<!DOCTYPE html>
<html>
<head>
<title>Ultra Health AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#ff4d4d,#ffffff);
    text-align:center;
}

.card {
    background:white;
    margin:15px auto;
    padding:20px;
    border-radius:20px;
    max-width:400px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input,select,button{
    width:90%;
    padding:10px;
    margin:5px;
    border-radius:10px;
}

button{
    background:red;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🔥 Ultra Health AI</h1>

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target Weight">
<input id="water" placeholder="Water">

<select id="diet">
<option value="veg">Veg</option>
<option value="non-veg">Non-Veg</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="startVoice()">🎤 Speak</button>
</div>

<div id="output" class="card"></div>

<canvas id="chart" width="300" height="200"></canvas>

<script>
// BMI
function bmi(w,h){
    h=h/100;
    return (w/(h*h)).toFixed(2);
}

// SAVE DATA 💾
function saveWeight(weight){
    let data = JSON.parse(localStorage.getItem("weights")) || [];
    data.push(weight);
    localStorage.setItem("weights",JSON.stringify(data));
}

// GRAPH 📊
function drawChart(){
    let canvas=document.getElementById("chart");
    let ctx=canvas.getContext("2d");

    let data = JSON.parse(localStorage.getItem("weights")) || [];

    ctx.clearRect(0,0,300,200);

    data.forEach((w,i)=>{
        ctx.fillRect(i*30,200-w,10,w);
    });
}

// VOICE 🎤
function startVoice(){
    let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.start();

    rec.onresult = function(e){
        let text = e.results[0][0].transcript;
        alert("You said: "+text);
    }
}

// MAIN
function generate(){
    let age = Number(age.value);
    let height = Number(height.value);
    let weight = Number(weight.value);
    let target = Number(target.value);
    let water = Number(water.value);
    let diet = document.getElementById("diet").value;

    let goal="maintain";
    if(target<weight) goal="lose";
    else if(target>weight) goal="gain";

    let bmiVal=bmi(weight,height);

    saveWeight(weight);
    drawChart();

    let output=`
    BMI: ${bmiVal}<br>
    Goal: ${goal}<br>
    Water: ${water}<br>
    `;

    if(diet==="non-veg"){
        output+="⚠️ No milk with fish/chicken<br>";
    }

    document.getElementById("output").innerHTML=output;
}
</script>

</body>
</html>
