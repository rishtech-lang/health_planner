<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0ea5e9,#1e3a8a);
    color:white;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-top:15px;
}

.tagline{
    font-size:12px;
    opacity:0.8;
}

.card{
    background:rgba(255,255,255,0.1);
    margin:15px auto;
    padding:20px;
    border-radius:20px;
    max-width:400px;
    backdrop-filter:blur(10px);
}

input,select,button{
    width:90%;
    padding:10px;
    margin:6px;
    border-radius:10px;
    border:none;
}

button{
    background:#0ea5e9;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#tip{
    margin-top:10px;
    opacity:0;
    transition:opacity 1s;
}
.show{
    opacity:1;
}
</style>
</head>

<body>

<div class="logo">⚡ BodyXP</div>
<div class="tagline">Level Up Your Body</div>

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target Weight">
<input id="water" placeholder="Water Intake">

<select id="diet">
<option value="veg">🥦 Veg</option>
<option value="non-veg">🍗 Non-Veg</option>
</select>

<button onclick="generate()">🚀 Generate</button>
<button onclick="startVoice()">🎤 Voice</button>
</div>

<div id="output" class="card"></div>
<div id="xpBox" class="card"></div>
<div id="tip"></div>

<canvas id="chart" width="300" height="200"></canvas>

<script>
// BMI
function bmi(w,h){
    return (w/((h/100)**2)).toFixed(2);
}

// XP SYSTEM
function updateXP(){
    let xp = Number(localStorage.getItem("xp")) || 0;
    xp += 10;
    let level = Math.floor(xp/50);

    localStorage.setItem("xp",xp);

    document.getElementById("xpBox").innerHTML =
        `🏆 XP: ${xp} | Level: ${level}`;
}

// SAVE WEIGHT
function saveWeight(w){
    let data = JSON.parse(localStorage.getItem("weights")) || [];
    data.push(w);
    localStorage.setItem("weights",JSON.stringify(data));
}

// GRAPH
function drawChart(){
    let c=document.getElementById("chart");
    let ctx=c.getContext("2d");

    let data = JSON.parse(localStorage.getItem("weights")) || [];

    ctx.clearRect(0,0,300,200);

    ctx.beginPath();
    data.forEach((w,i)=>{
        let x=i*30;
        let y=200-w;
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.stroke();
}

// VOICE INPUT
function startVoice(){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SR){
        alert("Voice not supported");
        return;
    }

    let rec = new SR();
    rec.start();

    rec.onresult = e=>{
        let t = e.results[0][0].transcript.toLowerCase();

        if(t.includes("age")) age.value = t.replace(/\D/g,'');
        if(t.includes("weight")) weight.value = t.replace(/\D/g,'');

        alert("Heard: "+t);
    }
}

// AI MEALS
function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

let foods={
    veg:["Paneer","Dal","Oats","Fruit","Roti","Soup","Upma","Poha"],
    nonveg:["Chicken","Fish","Eggs","Grilled chicken","Chicken curry"]
};

// TIPS SYSTEM
let tipInterval;

function startTips(extra){
    clearInterval(tipInterval);

    let tips=[
        "💧 Drink enough water",
        "🏃 Stay active",
        "🥦 Eat healthy",
        "😴 Sleep well",
        "🔥 Stay consistent"
    ];

    if(extra) tips.push(extra);

    let i=0;
    let box=document.getElementById("tip");

    tipInterval = setInterval(()=>{
        box.classList.remove("show");

        setTimeout(()=>{
            box.innerText=tips[i];
            box.classList.add("show");
            i=(i+1)%tips.length;
        },500);

    },3000);
}

// MAIN FUNCTION
function generate(){
    let ageVal=Number(age.value);
    let h=Number(height.value);
    let w=Number(weight.value);
    let t=Number(target.value);
    let waterVal=Number(water.value);
    let diet=document.getElementById("diet").value;

    if(!ageVal||!h||!w){
        alert("Fill all fields!");
        return;
    }

    let goal="maintain";
    if(t<w) goal="lose";
    else if(t>w) goal="gain";

    let bmiVal=bmi(w,h);

    saveWeight(w);
    drawChart();
    updateXP();

    let type=(diet==="veg")?"veg":"nonveg";

    let output=`
    <h3>📊 Health Report</h3>
    BMI: ${bmiVal}<br>
    Goal: ${goal}<br>
    Water: ${waterVal}<br><br>

    <h3>🍽 AI Meals</h3>
    Breakfast: ${random(foods[type])}<br>
    Lunch: ${random(foods[type])}<br>
    Dinner: ${random(foods[type])}<br>
    `;

    document.getElementById("output").innerHTML=output;

    let extra=null;
    if(diet==="non-veg"){
        extra="⚠️ Avoid milk with fish/chicken";
    }

    startTips(extra);
}

// LOAD SAVED DATA
drawChart();
updateXP();
</script>

</body>
</html>
