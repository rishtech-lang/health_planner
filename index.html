<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyXP</title>
  <style>
    :root {
      --bg: #f3f8ff;
      --card: #ffffff;
      --text: #0f1f3a;
      --muted: #4c6390;
      --primary: #2463eb;
      --danger: #dc3545;
      --border: #d8e4ff;
    }
    body.dark {
      --bg: #081631;
      --card: #112349;
      --text: #eaf1ff;
      --muted: #aac0e8;
      --primary: #63a4ff;
      --danger: #ff6b81;
      --border: #23417f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, var(--bg), #cbe0ff);
      color: var(--text);
    }
    body.dark { background: linear-gradient(145deg, #071226, #14336f); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .logo { font-size: 28px; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px rgba(63,145,255,.5); }
    .controls { display: flex; gap: 8px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
    }
    h3 { margin: 0 0 10px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input, select, button, textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px;
      background: var(--card); color: var(--text);
    }
    textarea { min-height: 80px; resize: vertical; }
    button { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 700; }
    .btn-secondary { background: #5d7bb8; }
    .btn-danger { background: var(--danger); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--border); border-radius:10px; padding:8px; margin-top:8px; }
    .small { color: var(--muted); font-size: 12px; }
    .done { text-decoration: line-through; color: var(--muted); }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="logo">💪 BODYXP</div>
      <div class="small">Simple Planner • Workout • BMI • Reminders • Testimonials</div>
    </div>
    <div class="controls">
      <button class="btn-secondary" onclick="toggleTheme()">Light / Dark</button>
    </div>
  </div>

  <div class="card">
    <h3>Generate Meal Plan</h3>
    <div class="grid-2">
      <div><label>Age</label><input id="age" type="number" min="1" max="120" /></div>
      <div><label>Diet Type</label><select id="diet"><option value="veg">Veg</option><option value="non-veg">Non-Veg</option></select></div>
      <div><label>Height (cm)</label><input id="height" type="number" min="40" max="260" /></div>
      <div><label>Weight (kg)</label><input id="weight" type="number" min="15" max="350" /></div>
      <div><label>Target Weight (kg)</label><input id="target" type="number" min="15" max="350" /></div>
      <div><label>Meal Style</label><select id="cuisine"><option value="indian">Indian</option><option value="english">English</option></select></div>
    </div>
    <button style="margin-top:10px" onclick="generatePlan()">Generate</button>
    <div id="error" class="small"></div>
  </div>

  <div class="card" id="output">Fill details and click Generate.</div>

  <div class="card">
    <h3>Workout Tracker</h3>
    <div class="grid-2">
      <input id="workoutInput" placeholder="e.g. 30 min walk" />
      <button onclick="addWorkout()">Add Workout</button>
    </div>
    <div id="workoutList"></div>
  </div>

  <div class="card">
    <h3>Reminders</h3>
    <div class="grid-2">
      <input id="reminderText" placeholder="Reminder" />
      <input id="reminderTime" type="datetime-local" />
    </div>
    <button style="margin-top:8px" onclick="addReminder()">Add Reminder</button>
    <div id="reminderList"></div>
  </div>

  <div class="card">
    <h3>Testimonials</h3>
    <div class="grid-2">
      <input id="tName" placeholder="Name" />
      <select id="tRating"><option>⭐ 1</option><option>⭐ 2</option><option>⭐ 3</option><option>⭐ 4</option><option selected>⭐ 5</option></select>
    </div>
    <textarea id="tMsg" placeholder="Write your testimonial..."></textarea>
    <button onclick="addTestimonial()">Submit Testimonial</button>
    <div id="testimonialList"></div>
  </div>
</div>
<script>
const K = { workouts: 'bodyxp_workouts', reminders: 'bodyxp_reminders', testimonials: 'bodyxp_testimonials', theme: 'bodyxp_theme' };
const plans = {
  indian: {
    veg: ['Poha','Roti + Dal','Khichdi','Idli + Sambar','Paneer + Rice'],
    'non-veg': ['Egg Bhurji','Chicken Curry + Rice','Fish Curry','Omelette + Roti','Chicken Soup']
  },
  english: {
    veg: ['Oatmeal','Veg Sandwich','Salad Bowl','Greek Yogurt + Fruit','Pasta Primavera'],
    'non-veg': ['Scrambled Eggs','Grilled Chicken','Baked Fish','Turkey Sandwich','Chicken Salad']
  }
};
const tips = ['Drink water regularly.','Sleep 7-8 hours.','Walk daily 20+ minutes.','Keep portions balanced.'];
function read(key){ try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }
function write(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
function ageGroup(age){ if(age<13) return 'Child'; if(age<18) return 'Teen'; if(age>=80) return 'Senior'; return 'Adult'; }
function bmi(weight,height){ return weight / ((height/100) ** 2); }
function bmiStatus(v){ if(v<18.5) return 'Underweight'; if(v<25) return 'Healthy'; if(v<30) return 'Overweight'; return 'Obese'; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function generatePlan(){
  const age=Number(ageEl.value), height=Number(heightEl.value), weight=Number(weightEl.value), target=Number(targetEl.value);
  const diet=dietEl.value, cuisine=cuisineEl.value;
  if(!age||!height||!weight||!target){ error.textContent='Please fill all fields.'; return; }
  error.textContent='';
  const group=ageGroup(age);
  const goal = target<weight?'Lose': target>weight?'Gain':'Maintain';
  const options = plans[cuisine][diet];
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const items = days.map(d=>`<li><b>${d}:</b> ${pick(options)} • ${pick(options)} • ${pick(options)}</li>`).join('');
  const b = bmi(weight,height);
  output.innerHTML = `
    <h3>Health Summary</h3>
    <p><b>BMI:</b> ${b.toFixed(1)} (${bmiStatus(b)})</p>
    <p><b>Meal Plan for:</b> ${group}</p>
    <p><b>Goal:</b> ${goal} | <b>Style:</b> ${cuisine[0].toUpperCase()+cuisine.slice(1)} | <b>Diet:</b> ${diet}</p>
    <ul>${items}</ul>
    <p class="small">Tip: ${pick(tips)}</p>`;
}
function renderWorkouts(){
  const arr=read(K.workouts);
  workoutList.innerHTML = arr.length ? arr.map((w,i)=>`<div class='list-item'><span class='${w.done?'done':''}'>${w.text}</span><div><button onclick='toggleWorkout(${i})'>${w.done?'Undo':'Done'}</button> <button class='btn-danger' onclick='removeWorkout(${i})'>Delete</button></div></div>`).join('') : '<div class="small">No workouts yet.</div>';
}
function addWorkout(){ const t=workoutInput.value.trim(); if(!t) return; const a=read(K.workouts); a.push({text:t,done:false}); write(K.workouts,a); workoutInput.value=''; renderWorkouts(); }
function toggleWorkout(i){ const a=read(K.workouts); if(!a[i]) return; a[i].done=!a[i].done; write(K.workouts,a); renderWorkouts(); }
function removeWorkout(i){ const a=read(K.workouts); a.splice(i,1); write(K.workouts,a); renderWorkouts(); }
function renderReminders(){
  const arr=read(K.reminders).sort((a,b)=>new Date(a.time)-new Date(b.time));
  reminderList.innerHTML = arr.length ? arr.map((r,i)=>`<div class='list-item'><div>${r.text}<div class='small'>${new Date(r.time).toLocaleString()}</div></div><button class='btn-danger' onclick='removeReminder(${i})'>Delete</button></div>`).join('') : '<div class="small">No reminders yet.</div>';
}
function addReminder(){ const text=reminderText.value.trim(), time=reminderTime.value; if(!text||!time) return; const a=read(K.reminders); a.push({text,time}); write(K.reminders,a); reminderText.value=''; reminderTime.value=''; renderReminders(); }
function removeReminder(i){ const a=read(K.reminders).sort((x,y)=>new Date(x.time)-new Date(y.time)); a.splice(i,1); write(K.reminders,a); renderReminders(); }
function renderTestimonials(){
  const arr=read(K.testimonials);
  testimonialList.innerHTML = arr.length ? arr.map(t=>`<div class='list-item'><div><b>${t.name}</b> ${t.rating}<div>${t.msg}</div></div><button class='btn-danger' onclick='removeTestimonial("${t.id}")'>Delete</button></div>`).join('') : '<div class="small">No testimonials yet.</div>';
}
function addTestimonial(){ const name=tName.value.trim(), msg=tMsg.value.trim(), rating=tRating.value; if(!name||!msg) return; const a=read(K.testimonials); a.push({id:Date.now().toString(),name,msg,rating}); write(K.testimonials,a); tName.value=''; tMsg.value=''; renderTestimonials(); }
function removeTestimonial(id){ const a=read(K.testimonials).filter(t=>t.id!==id); write(K.testimonials,a); renderTestimonials(); }
function toggleTheme(){ const dark=document.body.classList.toggle('dark'); localStorage.setItem(K.theme, dark?'dark':'light'); }
(function init(){ if(localStorage.getItem(K.theme)==='dark') document.body.classList.add('dark'); renderWorkouts(); renderReminders(); renderTestimonials(); })();
</script>
</body>
</html>
