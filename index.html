<!DOCTYPE html>
<html>
<head>
<title>BodyXP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#0f172a,#020617);
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:25px 10px;
}

/* ⚡ LIGHTNING LOGO */
.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.logo-text{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#60a5fa,#38bdf8,#ffffff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo svg{
    width:35px;
}

/* APP */
.app{
    max-width:420px;
    margin:auto;
    padding:10px;
}

/* CARD */
.card{
    background:#1e293b;
    border-radius:20px;
    padding:15px;
    margin-bottom:14px;
    animation:fadeIn 0.5s ease;
}

/* INPUTS */
input,select,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:none;
    font-size:14px;
}

/* BUTTON */
button{
    background:linear-gradient(90deg,#3b82f6,#0ea5e9);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    box-shadow:0 0 15px rgba(56,189,248,0.5);
}

button:active{
    transform:scale(0.96);
}

/* OUTPUT */
#output p{
    margin:8px 0;
}

/* TIPS */
#tip{
    text-align:center;
    opacity:0;
    transition:opacity 1s;
    font-size:14px;
}
.show{
    opacity:1;
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="header">

<div class="logo">

<!-- ⚡ LIGHTNING ICON -->
<svg viewBox="0 0 24 24">
<path fill="#38bdf8" d="M13 2L3 14h7l-1 8 10-12h-7z"/>
</svg>

<div class="logo-text">BODYXP</div>

</div>

<div style="font-size:12px;opacity:0.7;">Level Up Your Body</div>

</div>

<div class="app">

<div class="card">
<input id="age" placeholder="Age">
<input id="height" placeholder="Height (cm)">
<input id="weight" placeholder="Weight">
<input id="target" placeholder="Target Weight">
<input id="water" placeholder="Water Intake">

<select id="diet">
<option value="veg">Veg</option>
<option value="non-veg">Non-Veg</option>
</select>

<button onclick="generate()">Generate Plan</button>
</div>

<div id="output" class="card"></div>

<div id="tip"></div>

</div>

<script>

// MEALS SYSTEM
let meals={
veg:{
child:{
lose:["Fruit bowl","Dal + rice","Soup"],
gain:["Milkshake","Paneer + rice","Roti + veg"],
maintain:["Poha","Dal + roti","Veg"]
},
teen:{
lose:["Oats","Salad + dal","Soup"],
gain:["Shake + nuts","Rice + paneer","Veg"],
maintain:["Upma","Dal + roti","Veg"]
},
adult:{
lose:["Oats","Grilled veg","Soup"],
gain:["Protein shake","Paneer + rice","Full meal"],
maintain:["Idli","Balanced meal","Light dinner"]
}
},
"non-veg":{
child:{
lose:["Eggs","Chicken salad","Soup"],
gain:["Eggs","Chicken + rice","Fish"],
maintain:["Eggs","Chicken","Light"]
},
teen:{
lose:["Boiled eggs","Grilled chicken","Soup"],
gain:["Eggs","Chicken + rice","Fish"],
maintain:["Eggs","Chicken","Light"]
},
adult:{
lose:["Egg whites","Chicken salad","Soup"],
gain:["Eggs","Chicken + rice","Fish"],
maintain:["Eggs","Chicken","Balanced"]
}
}
};

// BMI
function bmi(w,h){
return (w/((h/100)**2)).toFixed(2);
}

// TIPS
let tipInterval;

function startTips(extra){
clearInterval(tipInterval);

let tips=[
"💧 Stay hydrated",
"🏃 Stay active",
"🥦 Eat healthy",
"😴 Sleep well",
"🔥 Stay consistent"
];

if(extra) tips.push(extra);

let i=0;

tipInterval=setInterval(()=>{
tip.classList.remove("show");

setTimeout(()=>{
tip.innerText=tips[i];
tip.classList.add("show");
i=(i+1)%tips.length;
},500);

},3000);
}

// MAIN
function generate(){
let a=Number(age.value);
let h=Number(height.value);
let w=Number(weight.value);
let t=Number(target.value);
let waterVal=Number(water.value);
let diet=document.getElementById("diet").value;

if(!a||!h||!w){
alert("Fill all fields!");
return;
}

// AGE GROUP
let group="adult";
if(a<13) group="child";
else if(a<18) group="teen";

// GOAL
let goal="maintain";
if(t<w) goal="lose";
else if(t>w) goal="gain";

// BMI
let b=bmi(w,h);

// SAVE DATA
localStorage.setItem("age",a);
localStorage.setItem("height",h);
localStorage.setItem("weight",w);

// GET MEAL
let meal=meals[diet][group][goal];

// OUTPUT
let out=`
<h3>📊 Health Report</h3>
BMI: ${b}<br>
Goal: ${goal}<br>
Water: ${waterVal}<br><br>

<h3>📅 Weekly Plan</h3>
`;

["Monday","Tuesday","Wednesday","Thursday","Friday"].forEach(day=>{
out+=`
<p><b>${day}</b><br>
🍳 ${meal[0]}<br>
🍛 ${meal[1]}<br>
🌙 ${meal[2]}</p>`;
});

output.innerHTML=out;

// RULE
let extra=null;
if(diet==="non-veg"){
extra="⚠️ Avoid milk with fish/chicken";
}

startTips(extra);
}

// LOAD
window.onload=function(){
age.value=localStorage.getItem("age")||"";
height.value=localStorage.getItem("height")||"";
weight.value=localStorage.getItem("weight")||"";
};

</script>

</body>
</html>
