<!DOCTYPE html>
<html>
<head>
    <title>Ultra Health Planner</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        input, select, button {
            margin: 8px;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }
        button {
            background: #22c55e;
            color: white;
            cursor: pointer;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>🚀 Ultra Health Planner</h1>

<div class="card">
    <input id="age" placeholder="Age"><br>
    <input id="height" placeholder="Height (cm)"><br>
    <input id="weight" placeholder="Current Weight (kg)"><br>
    <input id="target" placeholder="Target Weight (kg)"><br>
    <input id="water" placeholder="Water Intake (liters)"><br>

    <select id="diet">
        <option value="veg">Veg</option>
        <option value="non-veg">Non-Veg</option>
    </select><br>

    <button onclick="generatePlan()">Generate Plan</button>
</div>

<div id="output" class="card"></div>

<script>
function bmi(weight, height) {
    let h = height / 100;
    return (weight / (h*h)).toFixed(2);
}

function bmiCategory(bmi) {
    if (bmi < 18.5) return "Underweight";
    if (bmi < 25) return "Normal";
    if (bmi < 30) return "Overweight";
    return "Obese";
}

function generatePlan() {
    let age = Number(document.getElementById("age").value);
    let height = Number(document.getElementById("height").value);
    let weight = Number(document.getElementById("weight").value);
    let target = Number(document.getElementById("target").value);
    let water = Number(document.getElementById("water").value);
    let diet = document.getElementById("diet").value;

    let goal = "maintain";
    if (target < weight) goal = "lose";
    else if (target > weight) goal = "gain";

    let bmiVal = bmi(weight, height);
    let category = bmiCategory(bmiVal);

    let ageGroup = age < 13 ? "child" : "teen";

    let meals = {
    "lose": {
        "Monday": ["Oats", "Salad", "Soup"],
        "Tuesday": ["Fruit bowl", "Dal", "Veg soup"],
        "Wednesday": ["Smoothie", "Roti + sabzi", "Light meal"],
        "Thursday": ["Apple", "Paneer salad", "Soup"],
        "Friday": ["Poha", "Dal + roti", "Soup"]
    },
    "gain": {
        "Monday": ["Shake", "Rice + paneer", "Full meal"],
        "Tuesday": ["Banana milk", "Dal + rice", "Paneer"],
        "Wednesday": ["Oats + nuts", "Rice", "Curd"],
        "Thursday": ["Smoothie", "Paneer + roti", "Veg"],
        "Friday": ["Upma", "Dal + rice", "Curd"]
    },
    "maintain": {
        "Monday": ["Poha", "Dal + roti", "Veg"],
        "Tuesday": ["Milk + fruit", "Rice + dal", "Light meal"],
        "Wednesday": ["Upma", "Roti + veg", "Soup"],
        "Thursday": ["Oats", "Paneer + roti", "Veg"],
        "Friday": ["Idli", "Dal + rice", "Light sabzi"]
    }
};
    };

    let weekDays = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

    let output = `
        <h2>📊 Health Report</h2>
        BMI: ${bmiVal} (${category})<br>
        Goal: ${goal}<br>
        Hydration: ${water >= 0.5 ? "Good 💧" : "Drink more!"}<br><br>
    `;

    output += "<h2>🍽 Weekly Meal Plan</h2>";

   weekDays.forEach(day => {
    let dayMeals = meals[goal][day];

    output += `
        <p><b>${day}</b><br>
        Breakfast: ${dayMeals[0]}<br>
        Lunch: ${dayMeals[1]}<br>
        Dinner: ${dayMeals[2]}</p>
    `;
});
    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
